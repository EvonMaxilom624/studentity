# Manual CI candidate only; committing configuration is not hosted execution or release acceptance.
# Action commits verified by source inspection; runner/package compatibility still needs a hosted run.
name: "studentity: strict CI candidate"

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  APP_ENV: testing
  MONGODB_DATABASE: studentity_test_m0
  MONGODB_URI: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"
  DB_URL: ""
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  MAIL_MAILER: array

jobs:
  strict-ci-candidate:
    # Fixed OS matches the MongoDB noble repository; image contents remain mutable.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false # Checkout uses the read-only automatic job token.

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: mongodb-2.5.7
          coverage: none
          ini-values: memory_limit=512M

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Generate disposable synthetic encryption key
        run: |
          set -euo pipefail
          key="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          printf '::add-mask::%s\n' "$key"
          printf 'APP_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Setup job-local rs0 (candidate, hosted execution unmeasured)
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Only the new runner's disposable instance; never the developer's MongoDB service.
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org
          mkdir -p "$RUNNER_TEMP/studentity-mongo"
          mongod --dbpath "$RUNNER_TEMP/studentity-mongo" --logpath "$RUNNER_TEMP/studentity-mongo.log" --fork --replSet rs0 --bind_ip 127.0.0.1 --port 27017
          timeout 15s mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          # Outer timeout bounds the complete polling process, including connection delays.
          timeout 30s bash -c 'until mongosh "mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=1000&connectTimeoutMS=1000" --quiet --eval "const h=db.hello(); quit(h.isWritablePrimary === true && h.setName === \"rs0\" ? 0 : 1)"; do sleep 1; done'
          mongod --version

      - name: Install locked Composer dependencies with implicit scripts disabled
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          composer check-platform-reqs
          # Explicit required discovery only; no setup/update/create-project scripts.
          php artisan package:discover --ansi

      - name: Install locked npm dependencies
        run: |
          npm ci --ignore-scripts
          # Explicit esbuild binary verification; remaining lifecycle/registry trust review pending.
          npm rebuild esbuild

      - name: Initialize only fresh job-local catalogue databases
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Both fixed namespaces are required by Fnd02MongoSchemaTest.
          # They share local baseline names but are on this new runner's own loopback instance.
          # Guard BOTH before any migration. Never delete, drop, repair, or reuse existing state.
          mongosh --quiet --eval '
            for (const name of ["studentity_dev_m0","studentity_test_m0"]) {
              if (db.getSiblingDB(name).getCollectionInfos().length !== 0) {
                print("Fresh-only CI bootstrap rejected existing database state."); quit(1);
              }
            }
          '
          # The accepted migration is used only after proving a fresh exclusive job instance.
          # It is NOT a repair command and must never be run on accepted local databases.
          for name in studentity_dev_m0 studentity_test_m0; do
            MONGODB_DATABASE="$name" php artisan migrate --database=mongodb --path=database/migrations/mongodb --no-interaction
          done

      - name: Read-only environment and topology preflight
        run: php scripts/verification-preflight.php

      - name: Read-only live catalogue and migration-ledger verification
        run: php scripts/check-mongo-catalogue.php

      - name: Strict tests, mandatory build, unchanged selected inputs
        run: php scripts/verify-local.php --ci-candidate

# No deployment, artifact publication, signing, project secrets, or database deletion.
# MongoDB's 8.0 package patch, runtime/image identity and dependency registries are NOT
# fully frozen release inputs. Hosted verification, SBOM/signing and M0 acceptance remain open.
